name: publish

# Publishes to npm on a v* tag, tokenless, via npm OIDC "trusted publishing"
# (no NPM_TOKEN secret) with a provenance attestation.
#
# ONE-TIME PREREQUISITES (the workflow can't do these for you):
#   1. The repo must be PUBLIC: provenance attestation requires a public repo.
#   2. On npmjs.com → the cdp-toolkit package → Settings → Trusted Publisher,
#      add this GitHub repo + workflow (sblattj/cdp-toolkit, .github/workflows/publish.yml).
#      For a brand-new package name you typically do the FIRST `npm publish`
#      manually (npm login + npm publish), then wire trusted publishing for
#      subsequent releases.
#   3. npm OIDC trusted publishing requires npm 11.5.1 or newer AND Node
#      22.14.0 or newer, per npm's docs (docs.npmjs.com/trusted-publishers).
#      The setup-node step below pins Node 22.x, which satisfies the Node
#      requirement; the job upgrades npm explicitly afterward to satisfy the
#      npm one, then echoes `npm --version` so the log proves which version
#      actually ran.
#   4. `actions/setup-node` below must keep
#      `registry-url: "https://registry.npmjs.org"`. This matches npm's own
#      documented example for GitHub Actions trusted publishing. We tried
#      removing it once on a theory that it was interfering with OIDC; that
#      was wrong and made things worse, because without it npm attempts no auth at
#      all and fails immediately with ENEEDAUTH ("You need to authorize this
#      machine using `npm login`"). Keep it.
#   5. Trusted Publisher entries on npmjs.com also have an "Allowed actions"
#      selector (`npm publish`, `npm stage publish`, or both; entries created
#      after 2026-05-20 require an explicit choice). If a publish signs
#      provenance to Sigstore successfully and then still 404s on the actual
#      registry PUT, check that selector first; it is unconfirmed as OUR
#      cause, but it is the one documented setting that would produce exactly
#      that split (provenance is a separate OIDC path from the publish PUT).
#   6. Bump the version in package.json AND src/mcp.ts (VERSION), commit, then
#      push a matching tag:  git tag v1.0.1 && git push origin v1.0.1
#
# After that, every `git push origin v*` cuts a published, provenance-signed release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release for the tag (final step)
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build # also runs via prepublishOnly; explicit here as a gate
      # npm >= 11.5.1 is required for OIDC trusted publishing; refresh it and
      # print the version so the log proves it rather than leaving it inferred.
      - run: npm install -g npm@latest
      - run: npm --version
      # Idempotency guard: skip if this version is already on npm (e.g. a v1.0.0
      # tag cut after the first manual publish) so the run stays green.
      - name: Check if version already published
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "cdp-toolkit@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::cdp-toolkit@${VERSION} already on npm, skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # --loglevel verbose is temporary instrumentation: it makes npm's OIDC
      # attempt (or lack of one) visible in the run log instead of inferred,
      # since npm's normal output does not otherwise distinguish "OIDC token
      # exchange happened and was rejected" from "OIDC was never attempted."
      # Remove once trusted publishing is confirmed working end to end.
      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public --loglevel verbose
      # Every tag also gets a GitHub Release, so the Releases page never falls
      # behind npm again (it sat frozen at v1.0.0 through v1.3.0 because this
      # step did not exist). Uses the runner's built-in `gh` rather than a
      # third-party action, so there is no floating-ref supply-chain surface to
      # pin. Notes come from the matching CHANGELOG.md section; a version with
      # no section falls back to auto-generated notes. Idempotent: a re-run or a
      # re-dispatch that finds the release already there is a no-op.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists, skipping."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v v="$VERSION" 'BEGIN{pat="^## \\["v"\\]"} $0 ~ pat {p=1;next} /^## \[/{if(p)exit} p' CHANGELOG.md > "$NOTES"
          if [ -s "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES" --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi
